          DISTINCT_ACCOUNTS="$(query_scalar "SELECT COUNT(DISTINCT json_extract(detail_json,'$.account_id')) AS total FROM audit_events WHERE category='engine' AND action='outreach_simulation_commissioned' AND json_extract(detail_json,'$.account_id') IS NOT NULL;")"
          DISTINCT_ROLES="$(query_scalar "SELECT COUNT(DISTINCT json_extract(detail_json,'$.contact_role')) AS total FROM audit_events WHERE category='engine' AND action='outreach_simulation_commissioned' AND json_extract(detail_json,'$.contact_role') IS NOT NULL AND length(trim(json_extract(detail_json,'$.contact_role'))) > 0;")"

          if [ "$DISTINCT_ACCOUNTS" -lt 3 ]; then
            echo "Commissioning has not proven personalised simulations across three distinct accounts."
            exit 1
          fi

          if [ "$DISTINCT_ROLES" -lt 2 ]; then
            echo "Commissioning has not proven role diversity across at least two named roles."
            exit 1
          fi

          if [ "$AFTER_OUT" -ne "$BEFORE_OUT" ]; then
            echo "Real outbound changed during simulation commissioning."
            exit 1
