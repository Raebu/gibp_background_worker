              | jq '[.. | objects | .total? | numbers] | max // 0')"
            if [ "$AFTER_JOBS" -gt "$BEFORE_JOBS" ]; then
              break
            fi
            sleep 5
          done

          if [ "$AFTER_JOBS" -le "$BEFORE_JOBS" ]; then
            echo "Timed out waiting for repaired QEV job."
            exit 1
          fi

          npx wrangler d1 execute GROWTH_DB --remote --json --command "
            SELECT
              $BEFORE_RESULTS AS qev_results_before,
              (SELECT COUNT(*) FROM contact_email_verifications WHERE provider='quickemailverification') AS qev_results_after,
