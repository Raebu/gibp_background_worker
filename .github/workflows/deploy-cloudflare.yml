name: Provision and deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
      APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
      QUICKEMAILVERIFICATION_API_KEY: ${{ secrets.QUICKEMAILVERIFICATION_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Validate Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Resolve or create D1
        shell: bash
        run: |
          set -euo pipefail
          if npx wrangler d1 info gibp-growth --json > /tmp/d1-info.json 2>/tmp/d1-info.err; then
            node scripts/set-d1-from-info.mjs /tmp/d1-info.json
          else
            cat /tmp/d1-info.err || true
            npx wrangler d1 create gibp-growth --location weur --binding GROWTH_DB --update-config
          fi

      - name: Ensure background queue exists
        shell: bash
        run: |
          npx wrangler queues create gibp-growth-jobs || true

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply GROWTH_DB --remote

      - name: Deploy Worker in configured mode
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy | tee /tmp/wrangler-deploy.log
          WORKER_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -1)"
          test -n "$WORKER_URL"
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"

      - name: Verify public Worker health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$WORKER_URL/health" | tee /tmp/health.json; then
              grep -q '"ok":true' /tmp/health.json
              grep -q '"mode":"dry_run"' /tmp/health.json
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Verify branded growth domain
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --silent --show-error "https://growth.gibp.global/health" | tee /tmp/branded-health.json; then
              grep -q '"ok":true' /tmp/branded-health.json
              grep -q '"mode":"dry_run"' /tmp/branded-health.json
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Verify autonomous revenue OS public surfaces
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "https://growth.gibp.global/assessment/payment-readiness" | tee /tmp/readiness.html
          grep -q "Payment Infrastructure Readiness Score" /tmp/readiness.html

          curl --fail --silent --show-error "https://growth.gibp.global/insights" | tee /tmp/insights.html
          grep -q "GIBP Market Briefings" /tmp/insights.html

          curl --fail --silent --show-error "https://growth.gibp.global/dashboard" | tee /tmp/dashboard.html
          grep -q "Commercial desk" /tmp/dashboard.html

          curl --fail --silent --show-error "https://growth.gibp.global/briefing?gi=invalid" | tee /tmp/briefing.html
          grep -q "Briefing unavailable" /tmp/briefing.html

      - name: Ensure internal unsubscribe secret exists
        shell: bash
        run: |
          set -euo pipefail
          if ! npx wrangler secret list | grep -q 'UNSUBSCRIBE_SECRET'; then
            openssl rand -hex 32 | npx wrangler secret put UNSUBSCRIBE_SECRET
          fi

      - name: Ensure website intent signing secret exists
        shell: bash
        run: |
          set -euo pipefail
          if ! npx wrangler secret list | grep -q 'INTENT_SIGNING_SECRET'; then
            openssl rand -hex 32 | npx wrangler secret put INTENT_SIGNING_SECRET
          fi

      - name: Bootstrap Resend integration
        shell: bash
        run: |
          set -euo pipefail

          test -n "${RESEND_API_KEY:-}"
          test -n "${RESEND_WEBHOOK_SECRET:-}"

          printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          printf '%s' "$RESEND_WEBHOOK_SECRET" | npx wrangler secret put RESEND_WEBHOOK_SECRET

          echo "Resend API access and signed webhook verification are configured."

      - name: Sync optional Apollo search secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${APOLLO_API_KEY:-}" ]; then
            printf '%s' "$APOLLO_API_KEY" | npx wrangler secret put APOLLO_API_KEY
            echo "Apollo zero-credit candidate search is configured."
          else
            echo "APOLLO_API_KEY is not configured; candidate discovery will skip safely."
          fi

      - name: Sync optional QuickEmailVerification secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${QUICKEMAILVERIFICATION_API_KEY:-}" ]; then
            printf '%s' "$QUICKEMAILVERIFICATION_API_KEY" | npx wrangler secret put QUICKEMAILVERIFICATION_API_KEY
            echo "QuickEmailVerification secondary mailbox verification is configured."
          else
            echo "QUICKEMAILVERIFICATION_API_KEY is not configured; email verification will skip safely."
          fi

      - name: Verify QuickEmailVerification integration in sandbox
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QUICKEMAILVERIFICATION_API_KEY:-}" ]; then
            echo "QuickEmailVerification sandbox test skipped because no API key is configured."
            exit 0
          fi

          curl --fail --silent --show-error --get \
            "https://api.quickemailverification.com/v1/verify/sandbox" \
            --data-urlencode "email=safe-to-send@example.com" \
            --data-urlencode "apikey=$QUICKEMAILVERIFICATION_API_KEY" \
            | tee /tmp/qev-sandbox.json

          jq -e '(.success == true or .success == "true") and (.safe_to_send == true or .safe_to_send == "true")' /tmp/qev-sandbox.json >/dev/null
          echo "QuickEmailVerification sandbox verification passed without consuming a production verification."

      - name: Confirm Apollo enrichment is disabled and bounded
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs")
          const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"))
          if (config.vars.APOLLO_ENRICHMENT_DAILY_CAP !== "0") {
            throw new Error("APOLLO_ENRICHMENT_DAILY_CAP must remain 0 during commissioning")
          }
          NODE
          ! grep -R "reveal_phone_number: true" src
          ! grep -R "run_waterfall_email: true" src
          ! grep -R "run_waterfall_phone: true" src
          ! grep -R "/people/bulk_match" src

      - name: Re-verify health after secret bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$WORKER_URL/health" | tee /tmp/post-secret-health.json
          grep -q '"ok":true' /tmp/post-secret-health.json
          grep -q '"mode":"dry_run"' /tmp/post-secret-health.json

      - name: Verify signed Resend webhook path
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require("node:crypto")

          ;(async () => {
          const secret = process.env.RESEND_WEBHOOK_SECRET
          const workerUrl = process.env.WORKER_URL
          if (!secret || !workerUrl) process.exit(1)

          const id = `smoke_${crypto.randomUUID()}`
          const timestamp = Math.floor(Date.now() / 1000).toString()
          const body = JSON.stringify({
            type: "email.delivered",
            created_at: new Date().toISOString(),
            data: { email_id: `smoke_${crypto.randomUUID()}` }
          })

          const rawSecret = secret.startsWith("whsec_") ? secret.slice(6) : secret
          const key = Buffer.from(rawSecret, "base64")
          const signature = crypto
            .createHmac("sha256", key)
            .update(`${id}.${timestamp}.${body}`)
            .digest("base64")

          const response = await fetch(`${workerUrl}/webhooks/resend`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "svix-id": id,
              "svix-timestamp": timestamp,
              "svix-signature": `v1,${signature}`
            },
            body
          })

          const text = await response.text()
          if (!response.ok) {
            console.error(`Signed webhook smoke test failed with HTTP ${response.status}: ${text}`)
            process.exit(1)
          }

          const payload = JSON.parse(text)
          if (payload.ignored !== true) {
            console.error("Signed webhook smoke test returned an unexpected payload.")
            process.exit(1)
          }

          console.log("Signed Resend webhook verification passed.")
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE

      - name: Smoke-test autonomous queue execution
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues" \
            > /tmp/cloudflare-queues.json

          QUEUE_ID="$(jq -r '.result[] | select(.queue_name=="gibp-growth-jobs") | .queue_id' /tmp/cloudflare-queues.json | head -1)"
          test -n "$QUEUE_ID"

          query_count() {
            npx wrangler d1 execute GROWTH_DB --remote --json \
              --command "SELECT COUNT(*) AS total FROM audit_events WHERE category='engine' AND action='queue_job_complete' AND entity_id='maintenance';" \
              | jq '[.. | objects | .total? | numbers] | max // 0'
          }

          BEFORE="$(query_count)"

          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"body":{"kind":"maintenance"}}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues/$QUEUE_ID/messages" \
            > /tmp/queue-publish.json

          jq -e '.success == true' /tmp/queue-publish.json >/dev/null

          for attempt in $(seq 1 12); do
            AFTER="$(query_count)"
            if [ "$AFTER" -gt "$BEFORE" ]; then
              echo "Autonomous queue runtime smoke test completed."
              exit 0
            fi
            sleep 5
          done

          echo "Timed out waiting for the maintenance queue job to complete."
          exit 1

      - name: Commission official bank directories
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues" \
            > /tmp/directory-queues.json

          QUEUE_ID="$(jq -r '.result[] | select(.queue_name=="gibp-growth-jobs") | .queue_id' /tmp/directory-queues.json | head -1)"
          test -n "$QUEUE_ID"

          query_count() {
            npx wrangler d1 execute GROWTH_DB --remote --json \
              --command "SELECT COUNT(*) AS total FROM audit_events WHERE category='engine' AND action='queue_job_complete' AND entity_id='directories';" \
              | jq '[.. | objects | .total? | numbers] | max // 0'
          }

          BEFORE="$(query_count)"

          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"body":{"kind":"directories"}}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues/$QUEUE_ID/messages" \
            > /tmp/directory-publish.json

          jq -e '.success == true' /tmp/directory-publish.json >/dev/null

          for attempt in $(seq 1 36); do
            AFTER="$(query_count)"
            if [ "$AFTER" -gt "$BEFORE" ]; then
              echo "Official bank directory commissioning job completed."
              exit 0
            fi
            sleep 5
          done

          echo "Timed out waiting for official bank directory discovery."
          exit 1

      - name: Commission named-contact discovery
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues" \
            > /tmp/contact-queues.json

          QUEUE_ID="$(jq -r '.result[] | select(.queue_name=="gibp-growth-jobs") | .queue_id' /tmp/contact-queues.json | head -1)"
          test -n "$QUEUE_ID"

          query_count() {
            npx wrangler d1 execute GROWTH_DB --remote --json \
              --command "SELECT COUNT(*) AS total FROM audit_events WHERE category='engine' AND action='queue_job_complete' AND entity_id='contacts';" \
              | jq '[.. | objects | .total? | numbers] | max // 0'
          }

          BEFORE="$(query_count)"

          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"body":{"kind":"contacts"}}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues/$QUEUE_ID/messages" \
            > /tmp/contact-publish.json

          jq -e '.success == true' /tmp/contact-publish.json >/dev/null

          for attempt in $(seq 1 24); do
            AFTER="$(query_count)"
            if [ "$AFTER" -gt "$BEFORE" ]; then
              echo "Named-contact discovery commissioning job completed."
              exit 0
            fi
            sleep 5
          done

          echo "Timed out waiting for the named-contact discovery job to complete."
          exit 1

      - name: Commission zero-credit Apollo candidate discovery
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues" \
            > /tmp/apollo-queues.json

          QUEUE_ID="$(jq -r '.result[] | select(.queue_name=="gibp-growth-jobs") | .queue_id' /tmp/apollo-queues.json | head -1)"
          test -n "$QUEUE_ID"

          query_count() {
            npx wrangler d1 execute GROWTH_DB --remote --json \
              --command "SELECT COUNT(*) AS total FROM audit_events WHERE category='engine' AND action='queue_job_complete' AND entity_id='apollo_candidates';" \
              | jq '[.. | objects | .total? | numbers] | max // 0'
          }

          BEFORE="$(query_count)"

          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"body":{"kind":"apollo_candidates"}}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues/$QUEUE_ID/messages" \
            > /tmp/apollo-publish.json

          jq -e '.success == true' /tmp/apollo-publish.json >/dev/null

          for attempt in $(seq 1 24); do
            AFTER="$(query_count)"
            if [ "$AFTER" -gt "$BEFORE" ]; then
              echo "Apollo candidate commissioning job completed."
              exit 0
            fi
            sleep 5
          done

          echo "Timed out waiting for Apollo candidate discovery."
          exit 1

      - name: Commission one-time Apollo two-person enrichment test
        shell: bash
        run: |
          set -euo pipefail

          node - <<'NODE'
          const fs = require("fs")
          const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"))
          if (config.vars.SEND_MODE !== "dry_run") throw new Error("Commissioning requires SEND_MODE=dry_run")
          if (config.vars.APOLLO_ENRICHMENT_DAILY_CAP !== "0") {
            throw new Error("Persistent Apollo enrichment cap must remain zero")
          }
          NODE

          completed_count() {
            npx wrangler d1 execute GROWTH_DB --remote --json \
              --command "SELECT COUNT(*) AS total FROM settings WHERE key='apollo_enrichment_commissioning_v1_complete';" \
              | jq '[.. | objects | .total? | numbers] | max // 0'
          }

          if [ "$(completed_count)" -gt 0 ]; then
            echo "Apollo two-person commissioning test already completed; no credits can be spent again."
            exit 0
          fi

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues" \
            > /tmp/apollo-enrich-queues.json

          QUEUE_ID="$(jq -r '.result[] | select(.queue_name=="gibp-growth-jobs") | .queue_id' /tmp/apollo-enrich-queues.json | head -1)"
          test -n "$QUEUE_ID"

          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"body":{"kind":"apollo_enrich_commissioning"}}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues/$QUEUE_ID/messages" \
            > /tmp/apollo-enrich-publish.json

          jq -e '.success == true' /tmp/apollo-enrich-publish.json >/dev/null

          for attempt in $(seq 1 24); do
            if [ "$(completed_count)" -gt 0 ]; then
              echo "Apollo two-person commissioning test completed."
              npx wrangler d1 execute GROWTH_DB --remote --json --command "
                SELECT action,entity_id,detail_json,created_at
                FROM audit_events
                WHERE category='contacts'
                  AND entity_id='apollo_email_v1'
                ORDER BY created_at ASC;
              " | tee /tmp/apollo-enrichment-commissioning.json
              exit 0
            fi
            sleep 5
          done

          echo "Timed out waiting for Apollo enrichment commissioning test."
          exit 1

      - name: Commission one additional Apollo credit on a different account
        shell: bash
        run: |
          set -euo pipefail

          completed_count() {
            npx wrangler d1 execute GROWTH_DB --remote --json \
              --command "SELECT COUNT(*) AS total FROM settings WHERE key='apollo_enrichment_commissioning_v2_complete';" \
              | jq '[.. | objects | .total? | numbers] | max // 0'
          }

          if [ "$(completed_count)" -gt 0 ]; then
            echo "Apollo one-credit v2 commissioning already completed."
          else
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues" \
              > /tmp/apollo-v2-queues.json

            QUEUE_ID="$(jq -r '.result[] | select(.queue_name=="gibp-growth-jobs") | .queue_id' /tmp/apollo-v2-queues.json | head -1)"
            test -n "$QUEUE_ID"

            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"body":{"kind":"apollo_enrich_commissioning_v2"}}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues/$QUEUE_ID/messages" \
              > /tmp/apollo-v2-publish.json

            jq -e '.success == true' /tmp/apollo-v2-publish.json >/dev/null

            for attempt in $(seq 1 24); do
              if [ "$(completed_count)" -gt 0 ]; then
                echo "Apollo one-credit v2 commissioning completed."
                break
              fi
              sleep 5
            done

            if [ "$(completed_count)" -eq 0 ]; then
              echo "Timed out waiting for Apollo one-credit v2 commissioning."
              exit 1
            fi
          fi

          npx wrangler d1 execute GROWTH_DB --remote --json --command "
            SELECT action,entity_id,detail_json,created_at
            FROM audit_events
            WHERE category='contacts'
              AND entity_id='apollo_email_v2'
            ORDER BY created_at ASC;
          " | tee /tmp/apollo-v2-result.json

      - name: Verify the newly enriched email with QuickEmailVerification
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${QUICKEMAILVERIFICATION_API_KEY:-}" ]; then
            echo "QuickEmailVerification key missing after successful bootstrap."
            exit 1
          fi

          qev_complete_count() {
            npx wrangler d1 execute GROWTH_DB --remote --json \
              --command "SELECT COUNT(*) AS total FROM settings WHERE key='qev_commissioning_v2_complete';" \
              | jq '[.. | objects | .total? | numbers] | max // 0'
          }

          if [ "$(qev_complete_count)" -gt 0 ]; then
            echo "QEV v2 follow-up already completed."
            exit 0
          fi

          stored_count() {
            npx wrangler d1 execute GROWTH_DB --remote --json \
              --command "SELECT COUNT(*) AS total
                         FROM contacts ct
                         WHERE ct.email_source='apollo_verified'
                           AND ct.status='research_only'
                           AND ct.created_at >= datetime('now','-10 minute');" \
              | jq '[.. | objects | .total? | numbers] | max // 0'
          }

          if [ "$(stored_count)" -eq 0 ]; then
            echo "Apollo did not store a new research-only work email; no QEV production verification is needed."
            npx wrangler d1 execute GROWTH_DB --remote --json --command "
              INSERT INTO settings (key,value,updated_at)
              VALUES ('qev_commissioning_v2_complete','no_new_email',datetime('now'))
              ON CONFLICT(key) DO UPDATE SET value=excluded.value,updated_at=excluded.updated_at;
            " >/dev/null
            exit 0
          fi

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues" \
            > /tmp/qev-v2-queues.json

          QUEUE_ID="$(jq -r '.result[] | select(.queue_name=="gibp-growth-jobs") | .queue_id' /tmp/qev-v2-queues.json | head -1)"
          test -n "$QUEUE_ID"

          BEFORE="$(npx wrangler d1 execute GROWTH_DB --remote --json \
            --command "SELECT COUNT(*) AS total FROM audit_events WHERE category='engine' AND action='queue_job_complete' AND entity_id='email_verify_commissioning_v2';" \
            | jq '[.. | objects | .total? | numbers] | max // 0')"

          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"body":{"kind":"email_verify_commissioning_v2"}}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues/$QUEUE_ID/messages" \
            > /tmp/qev-v2-publish.json

          jq -e '.success == true' /tmp/qev-v2-publish.json >/dev/null

          for attempt in $(seq 1 24); do
            AFTER="$(npx wrangler d1 execute GROWTH_DB --remote --json \
              --command "SELECT COUNT(*) AS total FROM audit_events WHERE category='engine' AND action='queue_job_complete' AND entity_id='email_verify_commissioning_v2';" \
              | jq '[.. | objects | .total? | numbers] | max // 0')"
            if [ "$AFTER" -gt "$BEFORE" ]; then
              npx wrangler d1 execute GROWTH_DB --remote --json --command "
                INSERT INTO settings (key,value,updated_at)
                VALUES ('qev_commissioning_v2_complete','verified_once',datetime('now'))
                ON CONFLICT(key) DO UPDATE SET value=excluded.value,updated_at=excluded.updated_at;
              " >/dev/null
              break
            fi
            sleep 5
          done

          if [ "$(qev_complete_count)" -eq 0 ]; then
            echo "Timed out waiting for one-contact QEV verification."
            exit 1
          fi

          npx wrangler d1 execute GROWTH_DB --remote --json --command "
            SELECT
              (SELECT COUNT(*) FROM audit_events
                WHERE category='contacts'
                  AND action='qev_verification_request'
                  AND created_at >= datetime('now','start of day')) AS qev_requests_today,
              (SELECT COUNT(*) FROM contact_email_verifications
                WHERE provider='quickemailverification'
                  AND verified_at >= datetime('now','-10 minute')) AS qev_recent_results,
              (SELECT COUNT(*) FROM contact_email_verifications
                WHERE provider='quickemailverification'
                  AND safe_to_send=1
                  AND verified_at >= datetime('now','-10 minute')) AS qev_recent_safe;
          " | tee /tmp/qev-v2-result.json

      - name: Commission one-time QuickEmailVerification batch
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${QUICKEMAILVERIFICATION_API_KEY:-}" ]; then
            echo "QuickEmailVerification commissioning skipped because no API key is configured."
            exit 0
          fi

          completed_count() {
            npx wrangler d1 execute GROWTH_DB --remote --json \
              --command "SELECT COUNT(*) AS total FROM settings WHERE key='qev_initial_commissioning_v1_complete';" \
              | jq '[.. | objects | .total? | numbers] | max // 0'
          }

          if [ "$(completed_count)" -gt 0 ]; then
            echo "Initial QuickEmailVerification commissioning batch already completed."
            exit 0
          fi

          query_count() {
            npx wrangler d1 execute GROWTH_DB --remote --json \
              --command "SELECT COUNT(*) AS total FROM audit_events WHERE category='engine' AND action='queue_job_complete' AND entity_id='email_verify';" \
              | jq '[.. | objects | .total? | numbers] | max // 0'
          }

          BEFORE="$(query_count)"

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues" \
            > /tmp/qev-queues.json

          QUEUE_ID="$(jq -r '.result[] | select(.queue_name=="gibp-growth-jobs") | .queue_id' /tmp/qev-queues.json | head -1)"
          test -n "$QUEUE_ID"

          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"body":{"kind":"email_verify"}}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues/$QUEUE_ID/messages" \
            > /tmp/qev-publish.json

          jq -e '.success == true' /tmp/qev-publish.json >/dev/null

          for attempt in $(seq 1 24); do
            AFTER="$(query_count)"
            if [ "$AFTER" -gt "$BEFORE" ]; then
              npx wrangler d1 execute GROWTH_DB --remote --json --command "
                INSERT INTO settings (key,value,updated_at)
                VALUES ('qev_initial_commissioning_v1_complete',datetime('now'),datetime('now'))
                ON CONFLICT(key) DO UPDATE SET value=excluded.value, updated_at=excluded.updated_at;
              " >/dev/null

              echo "Initial QuickEmailVerification commissioning batch completed."
              npx wrangler d1 execute GROWTH_DB --remote --json --command "
                SELECT
                  (SELECT COUNT(*) FROM audit_events
                    WHERE category='contacts'
                      AND action='qev_verification_request'
                      AND created_at >= datetime('now','start of day')) AS qev_requests_today,
                  (SELECT COUNT(*) FROM contact_email_verifications
                    WHERE provider='quickemailverification'
                      AND safe_to_send=1
                      AND verified_at >= datetime('now','start of day')) AS qev_safe_today,
                  (SELECT COUNT(*) FROM contacts
                    WHERE status='verification_blocked') AS qev_blocked_contacts;
              " | tee /tmp/qev-commissioning.json
              exit 0
            fi
            sleep 5
          done

          echo "Timed out waiting for QuickEmailVerification commissioning batch."
          exit 1

      - name: Commission autonomous revenue OS v2 once
        shell: bash
        run: |
          set -euo pipefail

          completed_count() {
            npx wrangler d1 execute GROWTH_DB --remote --json \
              --command "SELECT COUNT(*) AS total FROM settings WHERE key='autonomous_revenue_os_v2_commissioned';" \
              | jq '[.. | objects | .total? | numbers] | max // 0'
          }

          if [ "$(completed_count)" -gt 0 ]; then
            echo "Autonomous revenue OS v2 commissioning already completed."
            exit 0
          fi

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues" \
            > /tmp/revenue-os-queues.json

          QUEUE_ID="$(jq -r '.result[] | select(.queue_name=="gibp-growth-jobs") | .queue_id' /tmp/revenue-os-queues.json | head -1)"
          test -n "$QUEUE_ID"

          run_job() {
            local KIND="$1"
            local BEFORE
            BEFORE="$(npx wrangler d1 execute GROWTH_DB --remote --json \
              --command "SELECT COUNT(*) AS total FROM audit_events WHERE category='engine' AND action='queue_job_complete' AND entity_id='$KIND';" \
              | jq '[.. | objects | .total? | numbers] | max // 0')"

            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"body\":{\"kind\":\"$KIND\"}}" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues/$QUEUE_ID/messages" \
              > "/tmp/revenue-os-$KIND.json"

            jq -e '.success == true' "/tmp/revenue-os-$KIND.json" >/dev/null

            for attempt in $(seq 1 36); do
              local AFTER
              AFTER="$(npx wrangler d1 execute GROWTH_DB --remote --json \
                --command "SELECT COUNT(*) AS total FROM audit_events WHERE category='engine' AND action='queue_job_complete' AND entity_id='$KIND';" \
                | jq '[.. | objects | .total? | numbers] | max // 0')"
              if [ "$AFTER" -gt "$BEFORE" ]; then
                echo "Autonomous v2 job completed: $KIND"
                return 0
              fi
              sleep 5
            done

            echo "Timed out waiting for autonomous v2 job: $KIND"
            return 1
          }

          run_job dossiers
          run_job email_verify
          run_job authority
          run_job learning

          npx wrangler d1 execute GROWTH_DB --remote --json --command "
            INSERT INTO settings (key,value,updated_at)
            VALUES ('autonomous_revenue_os_v2_commissioned',datetime('now'),datetime('now'))
            ON CONFLICT(key) DO UPDATE SET value=excluded.value,updated_at=excluded.updated_at;
          " >/dev/null

          npx wrangler d1 execute GROWTH_DB --remote --json --command "
            SELECT
              (SELECT COUNT(*) FROM account_dossiers) AS account_dossiers,
              (SELECT COUNT(*) FROM contacts WHERE status='active') AS active_contacts,
              (SELECT COUNT(*) FROM contact_email_verifications WHERE provider='quickemailverification') AS qev_results,
              (SELECT COUNT(*) FROM authority_briefings WHERE status='published') AS authority_briefings,
              (SELECT COUNT(*) FROM commercial_learnings) AS commercial_learnings,
              (SELECT COUNT(*) FROM messages WHERE direction='outbound') AS real_outbound;
          " | tee /tmp/revenue-os-v2-commissioning.json

      - name: Verify website intent ingestion
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Origin: https://www.gibp.global" \
            -H "Content-Type: application/json" \
            --data '{"event_type":"security_view","path":"/security","metadata":{"site":"gibp.global","source":"deployment_smoke"}}' \
            "https://growth.gibp.global/events/website" \
            | tee /tmp/website-intent.json
          grep -q '"recorded":true' /tmp/website-intent.json
          grep -q '"attributed":false' /tmp/website-intent.json

      - name: Print aggregate commissioning metrics
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute GROWTH_DB --remote --json --command "
            SELECT
              (SELECT COUNT(*) FROM accounts) AS accounts,
              (SELECT COUNT(*) FROM accounts WHERE domain IS NOT NULL AND domain!='') AS accounts_with_domain,
              (SELECT COUNT(*) FROM accounts WHERE last_researched_at IS NOT NULL) AS researched_accounts,
              (SELECT COUNT(*) FROM accounts WHERE status='qualified') AS qualified_accounts,
              (SELECT COUNT(*)
                 FROM accounts a
                 JOIN jurisdiction_policies jp ON jp.country_code=upper(COALESCE(a.country_code,''))
                WHERE jp.allowed=1 AND jp.requires_consent=0 AND jp.allow_corporate_b2b=1) AS policy_eligible_accounts,
              (SELECT COUNT(*)
                 FROM accounts a
                 JOIN jurisdiction_policies jp ON jp.country_code=upper(COALESCE(a.country_code,''))
                WHERE jp.allowed=1 AND jp.requires_consent=0 AND jp.allow_corporate_b2b=1
                  AND a.domain IS NOT NULL AND a.domain!='') AS policy_eligible_domains,
              (SELECT COUNT(*)
                 FROM accounts a
                 JOIN jurisdiction_policies jp ON jp.country_code=upper(COALESCE(a.country_code,''))
                WHERE jp.allowed=1 AND jp.requires_consent=0 AND jp.allow_corporate_b2b=1
                  AND a.status='qualified') AS policy_eligible_qualified,
              (SELECT COUNT(*) FROM accounts WHERE source='fdic_bankfind') AS fdic_accounts,
              (SELECT COUNT(*) FROM contact_candidates WHERE provider='apollo' AND status='candidate') AS apollo_contact_candidates,
              (SELECT COUNT(DISTINCT account_id) FROM contact_candidates WHERE provider='apollo' AND status='candidate') AS apollo_candidate_accounts,
              (SELECT COUNT(*) FROM contact_candidates WHERE provider='apollo' AND status='enriched') AS apollo_enriched_candidates,
              (SELECT COUNT(*) FROM contacts WHERE email_source='apollo_verified' AND status='research_only') AS apollo_research_only_contacts,
              (SELECT COUNT(*) FROM audit_events WHERE category='contacts' AND action='apollo_enrichment_spend' AND created_at >= datetime('now','start of day')) AS apollo_enrichment_spend_today,
              (SELECT COUNT(*) FROM contact_email_verifications WHERE provider='quickemailverification' AND safe_to_send=1 AND verified_at >= datetime('now','-30 day')) AS qev_safe_contacts,
              (SELECT COUNT(*) FROM audit_events WHERE category='contacts' AND action='qev_verification_request' AND created_at >= datetime('now','start of day')) AS qev_requests_today,
              (SELECT COUNT(*) FROM contacts WHERE status='active') AS active_contacts,
              (SELECT COUNT(*) FROM contacts WHERE status='active' AND name IS NOT NULL AND length(trim(name))>0) AS named_active_contacts,
              (SELECT COUNT(*) FROM audit_events WHERE category='contacts' AND action='public_scan_v3' AND created_at >= datetime('now','-7 day')) AS contact_scans_last_7d,
              (SELECT COUNT(*) FROM conversations) AS conversations,
              (SELECT COUNT(*) FROM messages WHERE direction='simulation') AS simulations,
              (SELECT COUNT(*) FROM messages WHERE direction='outbound') AS real_outbound,
              (SELECT COUNT(*) FROM opportunities WHERE kind='rfp') AS rfp_opportunities,
              (SELECT COUNT(*) FROM website_intent) AS website_intent_events,
              (SELECT COUNT(*) FROM account_dossiers) AS account_dossiers,
              (SELECT COUNT(*) FROM qualification_profiles) AS qualification_profiles,
              (SELECT COUNT(*) FROM conversion_requests) AS conversion_requests,
              (SELECT COUNT(*) FROM meeting_requests) AS meeting_requests,
              (SELECT COUNT(*) FROM authority_briefings WHERE status='published') AS authority_briefings,
              (SELECT COUNT(*) FROM commercial_outcomes) AS commercial_outcomes,
              (SELECT COUNT(*) FROM search_demand) AS search_demand_queries,
              (SELECT COUNT(*) FROM handoffs WHERE status='ready') AS ready_sales_handoffs,
              (SELECT COUNT(*) FROM opportunity_handoffs WHERE status='ready') AS ready_procurement_handoffs;
          " | tee /tmp/commissioning-metrics.json

      - name: Print discovery source diagnostics
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute GROWTH_DB --remote --json --command "
            SELECT category,action,entity_id,detail_json,created_at
            FROM audit_events
            WHERE category IN ('discovery','procurement','contacts','ai')
            ORDER BY created_at DESC
            LIMIT 40;
          " | tee /tmp/discovery-diagnostics.json

      - name: Confirm deployment configuration remained dry-run
        run: |
          node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));if(c.vars.SEND_MODE!=="dry_run")process.exit(1)'
