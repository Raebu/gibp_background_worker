            > /tmp/outreach-simulation-queues.json

          QUEUE_ID="$(jq -r '.result[] | select(.queue_name=="gibp-growth-jobs") | .queue_id' /tmp/outreach-simulation-queues.json | head -1)"
          test -n "$QUEUE_ID"

          BEFORE_JOB="$(query_scalar "SELECT COUNT(*) AS total FROM audit_events WHERE category='engine' AND action='queue_job_complete' AND entity_id='outreach_simulation_commissioning';")"
          BEFORE_OUT="$(query_scalar "SELECT COUNT(*) AS total FROM messages WHERE direction='outbound';")"

          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"body":{"kind":"outreach_simulation_commissioning"}}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues/$QUEUE_ID/messages" \
            > /tmp/outreach-simulation-publish.json

          jq -e '.success == true' /tmp/outreach-simulation-publish.json >/dev/null

          for attempt in $(seq 1 24); do
            AFTER_JOB="$(query_scalar "SELECT COUNT(*) AS total FROM audit_events WHERE category='engine' AND action='queue_job_complete' AND entity_id='outreach_simulation_commissioning';")"
            if [ "$AFTER_JOB" -gt "$BEFORE_JOB" ]; then
