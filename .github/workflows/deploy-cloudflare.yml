name: Provision and deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
      APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
      QUICKEMAILVERIFICATION_API_KEY: ${{ secrets.QUICKEMAILVERIFICATION_API_KEY }}
      GSC_GOOGLE_CLIENT_ID: ${{ secrets.GSC_GOOGLE_CLIENT_ID }}
      GSC_GOOGLE_CLIENT_SECRET: ${{ secrets.GSC_GOOGLE_CLIENT_SECRET }}
      GSC_GOOGLE_REFRESH_TOKEN: ${{ secrets.GSC_GOOGLE_REFRESH_TOKEN }}
      CALENDAR_GOOGLE_CLIENT_ID: ${{ secrets.CALENDAR_GOOGLE_CLIENT_ID }}
      CALENDAR_GOOGLE_CLIENT_SECRET: ${{ secrets.CALENDAR_GOOGLE_CLIENT_SECRET }}
      CALENDAR_GOOGLE_REFRESH_TOKEN: ${{ secrets.CALENDAR_GOOGLE_REFRESH_TOKEN }}
      CRM_WEBHOOK_URL: ${{ secrets.CRM_WEBHOOK_URL }}
      CRM_WEBHOOK_SECRET: ${{ secrets.CRM_WEBHOOK_SECRET }}
      HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
      SALESFORCE_INSTANCE_URL: ${{ secrets.SALESFORCE_INSTANCE_URL }}
      SALESFORCE_ACCESS_TOKEN: ${{ secrets.SALESFORCE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Validate Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Resolve or create D1
        shell: bash
        run: |
          set -euo pipefail
          if npx wrangler d1 info gibp-growth --json > /tmp/d1-info.json 2>/tmp/d1-info.err; then
            node scripts/set-d1-from-info.mjs /tmp/d1-info.json
          else
            cat /tmp/d1-info.err || true
            npx wrangler d1 create gibp-growth --location weur --binding GROWTH_DB --update-config
          fi

      - name: Ensure background queue exists
        shell: bash
        run: |
          npx wrangler queues create gibp-growth-jobs || true

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply GROWTH_DB --remote

      - name: Verify live operations hardening schema
        shell: bash
        run: |
          set -euo pipefail
          TABLE_COUNT="$(npx wrangler d1 execute GROWTH_DB --remote --json --command "
            SELECT COUNT(*) AS total
            FROM sqlite_master
            WHERE type='table'
              AND name IN (
                'outbound_dispatches',
                'webhook_events',
                'operations_alerts',
                'dead_letters',
                'deliverability_checks',
                'daily_commercial_reports',
                'conversion_attribution'
              );
          " | jq '[.. | objects | .total? | numbers] | max // 0')"
          test "$TABLE_COUNT" -eq 7
          echo "Live operations hardening schema verified: $TABLE_COUNT/7 tables."

      - name: Verify gold-standard commercial schema
        shell: bash
        run: |
          set -euo pipefail
          GOLD_TABLE_COUNT="$(npx wrangler d1 execute GROWTH_DB --remote --json --command "
            SELECT COUNT(*) AS total
            FROM sqlite_master
            WHERE type='table'
              AND name IN (
                'job_heartbeats',
                'account_governance',
                'contact_data_quality',
                'sending_blackouts',
                'crm_sync_records',
                'crm_inbound_events',
                'experiments',
                'experiment_variants',
                'experiment_assignments',
                'experiment_events',
                'funnel_snapshots'
              );
          " | jq '[.. | objects | .total? | numbers] | max // 0')"
          test "$GOLD_TABLE_COUNT" -eq 11
          echo "Gold-standard commercial schema verified: $GOLD_TABLE_COUNT/11 tables."

          CONTACT_COLUMNS="$(npx wrangler d1 execute GROWTH_DB --remote --json --command "
            SELECT COUNT(*) AS total
            FROM pragma_table_info('contacts')
            WHERE name IN ('identity_verified_at','role_verified_at');
          " | jq '[.. | objects | .total? | numbers] | max // 0')"
          test "$CONTACT_COLUMNS" -eq 2
          echo "Contact freshness evidence columns verified."

      - name: Verify multi-surface lifecycle schema
        shell: bash
        run: |
          set -euo pipefail
          SURFACE_TABLE_COUNT="$(npx wrangler d1 execute GROWTH_DB --remote --json --command "
            SELECT COUNT(*) AS total
            FROM sqlite_master
            WHERE type='table'
              AND name IN (
                'account_lifecycle',
                'identity_links',
                'product_events',
                'lifecycle_signals',
                'search_demand_sites',
                'surface_experiment_assignments',
                'surface_experiment_events',
                'synthetic_journey_checks',
                'site_daily_metrics',
                'product_user_lifecycle',
                'product_user_signals'
              );
          " | jq '[.. | objects | .total? | numbers] | max // 0')"
          test "$SURFACE_TABLE_COUNT" -eq 11
          echo "Multi-surface lifecycle schema verified: $SURFACE_TABLE_COUNT/11 tables."

          for table in website_intent conversion_requests meeting_requests conversion_attribution; do
            COLUMN_COUNT="$(npx wrangler d1 execute GROWTH_DB --remote --json --command "
              SELECT COUNT(*) AS total FROM pragma_table_info('$table') WHERE name='source_site';
            " | jq '[.. | objects | .total? | numbers] | max // 0')"
            test "$COLUMN_COUNT" -eq 1
          done
          echo "Source-site attribution columns verified on all commercial event surfaces."

      - name: Preflight controlled live ramp
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs")
          const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"))
          if (config.vars.SEND_MODE !== "live") throw new Error("Controlled rollout requires SEND_MODE=live")
          if (config.vars.RAMP_START_CAP !== "5") throw new Error("Controlled rollout requires RAMP_START_CAP=5")
          if (config.vars.APOLLO_ENRICHMENT_DAILY_CAP !== "0") throw new Error("Paid Apollo enrichment must remain disabled")
          const gscSites = String(config.vars.GSC_SITE_URLS || "")
          if (!gscSites.includes("gibp.global") || !gscSites.includes("gibp.app")) {
            throw new Error("Both GIBP Search Console properties must remain configured")
          }
          if (!String(config.vars.SUPABASE_AUTH_URL || "").includes("supabase.co")) {
            throw new Error("Supabase Auth URL must be configured for gibp.app lifecycle events")
          }
          if (!String(config.vars.SUPABASE_PUBLISHABLE_KEY || "").startsWith("sb_publishable_")) {
            throw new Error("Supabase publishable key must be configured for user-token verification")
          }
          NODE

          SECRET_LIST=""
          for attempt in 1 2 3 4; do
            if SECRET_LIST="$(npx wrangler secret list)"; then
              break
            fi
            echo "Cloudflare secret-list attempt $attempt failed; retrying control-plane read."
            sleep $((attempt * 5))
          done
          test -n "$SECRET_LIST"
          for required in RESEND_API_KEY UNSUBSCRIBE_SECRET QUICKEMAILVERIFICATION_API_KEY; do
            echo "$SECRET_LIST" | grep -q "$required" || {
              echo "Missing required live-outreach secret: $required"
              exit 1
            }
          done

          ELIGIBLE="$(npx wrangler d1 execute GROWTH_DB --remote --json --command "
            SELECT COUNT(DISTINCT ct.id) AS total
            FROM contacts ct
            JOIN accounts a ON a.id=ct.account_id
            JOIN contact_email_verifications q
              ON q.contact_id=ct.id
             AND q.provider='quickemailverification'
             AND q.verified_at >= datetime('now','-30 day')
            JOIN jurisdiction_policies jp
              ON jp.country_code=COALESCE(NULLIF(ct.country_code,''),NULLIF(a.country_code,''))
            JOIN jurisdiction_policy_evidence pe
              ON pe.country_code=jp.country_code
            WHERE ct.status='active'
              AND trim(COALESCE(ct.name,''))<>''
              AND ct.verified=1
              AND COALESCE(ct.identity_verified_at,ct.updated_at) >= datetime('now','-90 day')
              AND COALESCE(ct.role_verified_at,ct.updated_at) >= datetime('now','-90 day')
              AND NOT EXISTS (
                SELECT 1 FROM account_governance g
                WHERE g.account_id=a.id
                  AND (
                    g.never_contact=1 OR
                    ((g.manual_review_required=1 OR g.vip=1) AND g.manual_review_approved_at IS NULL)
                  )
              )
              AND NOT EXISTS (
                SELECT 1 FROM account_lifecycle l
                WHERE l.account_id=a.id
                  AND l.stage IN ('trial','customer','partner','former_customer')
              )
              AND q.result='valid'
              AND q.safe_to_send=1
              AND q.disposable=0
              AND q.accept_all=0
              AND q.role=0
              AND jp.allowed=1
              AND pe.review_due_at > datetime('now');
          " | jq '[.. | objects | .total? | numbers] | max // 0')"

          if [ "$ELIGIBLE" -lt 1 ]; then
            echo "No named, QEV-safe contacts currently have an allowed jurisdiction with current policy evidence."
            exit 1
          fi
          echo "Controlled live-ramp preflight passed with $ELIGIBLE policy-current QEV-safe named contacts."

      - name: Upload and activate exact Worker version
        shell: bash
        run: |
          set -euo pipefail

          node - <<'NODE'
          const fs = require("fs")
          const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"))
          config.vars = config.vars || {}
          config.vars.RELEASE_SHA = process.env.GITHUB_SHA
          fs.writeFileSync("wrangler.jsonc", JSON.stringify(config, null, 2) + "\n")
          NODE

          SERVICE_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/gibp-background-worker"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
              --connect-timeout 5 --max-time 12 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$SERVICE_URL" | jq -e '.success == true' >/dev/null; then
              echo "Cloudflare Worker service control plane is healthy."
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Cloudflare Worker service endpoint remained unavailable."
              exit 1
            fi
            sleep 8
          done

          TAG="release-${GITHUB_SHA:0:12}"
          VERSION_ID=""
          for attempt in 1 2 3 4; do
            echo "Version upload attempt $attempt/4"
            set +e
            timeout --signal=TERM --kill-after=15s 90s \
              npx wrangler versions upload \
                --message "GitHub production release $GITHUB_SHA" \
                --tag "$TAG" \
                2>&1 | tee /tmp/version-upload.log
            UPLOAD_STATUS=${PIPESTATUS[0]}
            set -e

            VERSION_ID="$(
              grep -Eo '(Worker )?Version ID:[[:space:]]*[a-fA-F0-9-]+' /tmp/version-upload.log \
                | tail -1 \
                | sed -E 's/.*Version ID:[[:space:]]*//' \
                || true
            )"

            if [ "$UPLOAD_STATUS" -eq 0 ] && [ -n "$VERSION_ID" ]; then
              echo "$VERSION_ID" | grep -Eq '^[a-fA-F0-9-]{32,40}$'
              echo "Uploaded exact production Worker version: $VERSION_ID"
              break
            fi

            VERSION_ID=""
            if [ "$attempt" -eq 4 ]; then
              echo "Unable to upload an exact production Worker version."
              exit "${UPLOAD_STATUS:-1}"
            fi
            sleep $((attempt * 5))
          done

          test -n "$VERSION_ID"
          echo "VERSION_ID=$VERSION_ID" >> "$GITHUB_ENV"

          DEPLOYED=false
          for attempt in 1 2 3; do
            echo "Exact version activation attempt $attempt/3"
            set +e
            timeout --signal=TERM --kill-after=15s 90s \
              npx wrangler versions deploy "$VERSION_ID@100%" -y \
                --message "Exact GitHub production release $GITHUB_SHA" \
                2>&1 | tee /tmp/version-deploy.log
            DEPLOY_STATUS=${PIPESTATUS[0]}
            set -e

            if [ "$DEPLOY_STATUS" -eq 0 ]; then
              DEPLOYED=true
              break
            fi

            # A Cloudflare parser/control-plane failure may happen after traffic
            # has already moved. Prove the exact release before retrying.
            if curl --fail --silent --show-error \
              --connect-timeout 8 --max-time 20 \
              "https://growth.gibp.global/health" -o /tmp/post-deploy-health.json \
              && jq -e --arg sha "$GITHUB_SHA" \
                '.ok == true and .mode == "live" and .release_sha == $sha' \
                /tmp/post-deploy-health.json >/dev/null; then
              echo "Production already serves the exact SHA despite Wrangler status $DEPLOY_STATUS."
              DEPLOYED=true
              break
            fi

            sleep $((attempt * 5))
          done

          if [ "$DEPLOYED" != "true" ]; then
            echo "Exact Worker version could not be activated."
            exit 1
          fi

          # versions upload intentionally separates versioned code from routes,
          # custom domains and cron triggers. Apply those config surfaces
          # explicitly and fail closed if Cloudflare cannot confirm them.
          TRIGGERS_OK=false
          for attempt in 1 2 3; do
            echo "Trigger sync attempt $attempt/3"
            set +e
            timeout --signal=TERM --kill-after=15s 60s \
              npx wrangler triggers deploy 2>&1 | tee /tmp/triggers-deploy.log
            TRIGGER_STATUS=${PIPESTATUS[0]}
            set -e

            if [ "$TRIGGER_STATUS" -eq 0 ]; then
              TRIGGERS_OK=true
              break
            fi
            sleep $((attempt * 5))
          done

          if [ "$TRIGGERS_OK" != "true" ]; then
            echo "Worker code is live, but routes/domains/cron trigger sync could not be proven."
            exit 1
          fi

          echo "WORKER_URL=https://growth.gibp.global" >> "$GITHUB_ENV"

      - name: Verify public Worker health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error "$WORKER_URL/health" -o /tmp/health.json; then
              cat /tmp/health.json
              if jq -e --arg sha "$GITHUB_SHA" \
                '.ok == true and .mode == "live" and .release_sha == $sha' \
                /tmp/health.json >/dev/null; then
                exit 0
              fi
              OBSERVED_SHA="$(jq -r '.release_sha // "missing"' /tmp/health.json 2>/dev/null || echo invalid_json)"
              echo "Health is live but still serving $OBSERVED_SHA ($attempt/20)."
            fi
            sleep 3
          done
          exit 1

      - name: Verify branded growth domain
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error "https://growth.gibp.global/health" -o /tmp/branded-health.json; then
              cat /tmp/branded-health.json
              if jq -e --arg sha "$GITHUB_SHA" \
                '.ok == true and .mode == "live" and .release_sha == $sha' \
                /tmp/branded-health.json >/dev/null; then
                exit 0
              fi
              OBSERVED_SHA="$(jq -r '.release_sha // "missing"' /tmp/branded-health.json 2>/dev/null || echo invalid_json)"
              echo "Branded domain still serves $OBSERVED_SHA ($attempt/24)."
            fi
            sleep 5
          done
          exit 1

      - name: Verify autonomous revenue OS public surfaces
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "https://growth.gibp.global/assessment/payment-readiness" | tee /tmp/readiness.html
          grep -q "Payment Infrastructure Readiness Score" /tmp/readiness.html

          curl --fail --silent --show-error "https://growth.gibp.global/insights" | tee /tmp/insights.html
          grep -q "GIBP Market Briefings" /tmp/insights.html

          curl --fail --silent --show-error "https://growth.gibp.global/dashboard" | tee /tmp/dashboard.html
          grep -q "Commercial desk" /tmp/dashboard.html

          curl --fail --silent --show-error "https://growth.gibp.global/briefing?gi=invalid" | tee /tmp/briefing.html
          grep -q "Briefing unavailable" /tmp/briefing.html

      - name: Verify both GIBP website collectors
        shell: bash
        run: |
          set -euo pipefail
          for origin in https://www.gibp.global https://www.gibp.app; do
            headers="$(mktemp)"
            curl --fail --silent --show-error               -X OPTIONS               -H "Origin: $origin"               -D "$headers"               -o /dev/null               "$WORKER_URL/events/website"
            grep -Fiq "access-control-allow-origin: $origin" "$headers"
          done
          echo "gibp.global and gibp.app are both accepted by the shared intent collector."

      - name: Ensure internal unsubscribe secret exists
        shell: bash
        run: |
          set -euo pipefail
          if ! npx wrangler secret list | grep -q 'UNSUBSCRIBE_SECRET'; then
            openssl rand -hex 32 | npx wrangler secret put UNSUBSCRIBE_SECRET
          fi

      - name: Ensure website intent signing secret exists
        shell: bash
        run: |
          set -euo pipefail
          if ! npx wrangler secret list | grep -q 'INTENT_SIGNING_SECRET'; then
            openssl rand -hex 32 | npx wrangler secret put INTENT_SIGNING_SECRET
          fi

      - name: Bootstrap Resend integration
        shell: bash
        run: |
          set -euo pipefail

          test -n "${RESEND_API_KEY:-}"
          test -n "${RESEND_WEBHOOK_SECRET:-}"

          printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          printf '%s' "$RESEND_WEBHOOK_SECRET" | npx wrangler secret put RESEND_WEBHOOK_SECRET

          echo "Resend API access and signed webhook verification are configured."

      - name: Sync optional Apollo search secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${APOLLO_API_KEY:-}" ]; then
            printf '%s' "$APOLLO_API_KEY" | npx wrangler secret put APOLLO_API_KEY
            echo "Apollo zero-credit candidate search is configured."
          else
            echo "APOLLO_API_KEY is not configured; candidate discovery will skip safely."
          fi

      - name: Sync optional QuickEmailVerification secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${QUICKEMAILVERIFICATION_API_KEY:-}" ]; then
            printf '%s' "$QUICKEMAILVERIFICATION_API_KEY" | npx wrangler secret put QUICKEMAILVERIFICATION_API_KEY
            echo "QuickEmailVerification secondary mailbox verification is configured."
          else
            echo "QUICKEMAILVERIFICATION_API_KEY is not configured; email verification will skip safely."
          fi

      - name: Sync optional Google growth integrations
        shell: bash
        run: |
          set -euo pipefail

          sync_secret() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" >/dev/null
              echo "$name configured."
            else
              echo "$name not configured; related Google integration will skip safely."
            fi
          }

          sync_secret GSC_GOOGLE_CLIENT_ID "${GSC_GOOGLE_CLIENT_ID:-}"
          sync_secret GSC_GOOGLE_CLIENT_SECRET "${GSC_GOOGLE_CLIENT_SECRET:-}"
          sync_secret GSC_GOOGLE_REFRESH_TOKEN "${GSC_GOOGLE_REFRESH_TOKEN:-}"
          sync_secret CALENDAR_GOOGLE_CLIENT_ID "${CALENDAR_GOOGLE_CLIENT_ID:-}"
          sync_secret CALENDAR_GOOGLE_CLIENT_SECRET "${CALENDAR_GOOGLE_CLIENT_SECRET:-}"
          sync_secret CALENDAR_GOOGLE_REFRESH_TOKEN "${CALENDAR_GOOGLE_REFRESH_TOKEN:-}"

      - name: Sync optional CRM integration secrets
        shell: bash
        run: |
          set -euo pipefail

          sync_secret() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" >/dev/null
              echo "$name configured."
            else
              echo "$name not configured; related CRM integration will skip safely."
            fi
          }

          sync_secret CRM_WEBHOOK_URL "${CRM_WEBHOOK_URL:-}"
          sync_secret CRM_WEBHOOK_SECRET "${CRM_WEBHOOK_SECRET:-}"
          sync_secret HUBSPOT_PRIVATE_APP_TOKEN "${HUBSPOT_PRIVATE_APP_TOKEN:-}"
          sync_secret SALESFORCE_INSTANCE_URL "${SALESFORCE_INSTANCE_URL:-}"
          sync_secret SALESFORCE_ACCESS_TOKEN "${SALESFORCE_ACCESS_TOKEN:-}"

      - name: Verify QuickEmailVerification integration in sandbox
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QUICKEMAILVERIFICATION_API_KEY:-}" ]; then
            echo "QuickEmailVerification sandbox test skipped because no API key is configured."
            exit 0
          fi

          curl --fail --silent --show-error --get \
            "https://api.quickemailverification.com/v1/verify/sandbox" \
            --data-urlencode "email=safe-to-send@example.com" \
            --data-urlencode "apikey=$QUICKEMAILVERIFICATION_API_KEY" \
            | tee /tmp/qev-sandbox.json

          jq -e '(.success == true or .success == "true") and (.safe_to_send == true or .safe_to_send == "true")' /tmp/qev-sandbox.json >/dev/null
          echo "QuickEmailVerification sandbox verification passed without consuming a production verification."

      - name: Confirm controlled live ramp safety configuration
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs")
          const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"))
          if (config.vars.SEND_MODE !== "live") {
            throw new Error("Controlled rollout requires SEND_MODE=live")
          }
          if (config.vars.RAMP_START_CAP !== "5") {
            throw new Error("RAMP_START_CAP must remain exactly 5 during controlled rollout")
          }
          if (config.vars.APOLLO_ENRICHMENT_DAILY_CAP !== "0") {
            throw new Error("APOLLO_ENRICHMENT_DAILY_CAP must remain exactly 0")
          }
          const gscSites = String(config.vars.GSC_SITE_URLS || "")
          if (!gscSites.includes("gibp.global") || !gscSites.includes("gibp.app")) {
            throw new Error("Dual-surface GSC configuration is required")
          }
          if (!String(config.vars.SUPABASE_AUTH_URL || "").includes("supabase.co")) {
            throw new Error("Supabase Auth verification must remain configured")
          }
          NODE
          ! grep -R "reveal_phone_number: true" src
          ! grep -R "run_waterfall_email: true" src
          ! grep -R "run_waterfall_phone: true" src
          ! grep -R "/people/bulk_match" src

      - name: Re-verify health after secret bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$WORKER_URL/health" | tee /tmp/post-secret-health.json
          grep -q '"ok":true' /tmp/post-secret-health.json
          grep -q '"mode":"live"' /tmp/post-secret-health.json

      - name: Verify signed Resend webhook path
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require("node:crypto")

          ;(async () => {
          const secret = process.env.RESEND_WEBHOOK_SECRET
          const workerUrl = process.env.WORKER_URL
          if (!secret || !workerUrl) process.exit(1)

          const id = `smoke_${crypto.randomUUID()}`
          const timestamp = Math.floor(Date.now() / 1000).toString()
          const body = JSON.stringify({
            type: "email.delivered",
            created_at: new Date().toISOString(),
            data: { email_id: `smoke_${crypto.randomUUID()}` }
          })

          const rawSecret = secret.startsWith("whsec_") ? secret.slice(6) : secret
          const key = Buffer.from(rawSecret, "base64")
          const signature = crypto
            .createHmac("sha256", key)
            .update(`${id}.${timestamp}.${body}`)
            .digest("base64")

          const response = await fetch(`${workerUrl}/webhooks/resend`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "svix-id": id,
              "svix-timestamp": timestamp,
              "svix-signature": `v1,${signature}`
            },
            body
          })

          const text = await response.text()
          if (!response.ok) {
            console.error(`Signed webhook smoke test failed with HTTP ${response.status}: ${text}`)
            process.exit(1)
          }

          const payload = JSON.parse(text)
          if (payload.ignored !== true) {
            console.error("Signed webhook smoke test returned an unexpected payload.")
            process.exit(1)
          }

          console.log("Signed Resend webhook verification passed.")
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE

      - name: Smoke-test autonomous queue execution
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
