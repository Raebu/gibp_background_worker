          grep -q '"qev_exception_delta": 0' /tmp/qev-repair-verification.json
          AFTER_OUTBOUND="$(npx wrangler d1 execute GROWTH_DB --remote --json \
            --command "SELECT COUNT(*) AS total FROM messages WHERE direction='outbound';" \
            | jq '[.. | objects | .total? | numbers] | max // 0')"
          test "$AFTER_OUTBOUND" -eq "$BEFORE_OUTBOUND"

          if ! grep -q '"qev_exception_delta": 0' /tmp/qev-repair-verification.json; then
            npx wrangler d1 execute GROWTH_DB --remote --json --command "
              SELECT entity_id,detail_json,created_at
              FROM audit_events
              WHERE category='contacts'
                AND action='qev_verification_exception'
              ORDER BY created_at DESC
              LIMIT 20;
            " | tee /tmp/qev-repair-exceptions.json
            exit 1
          fi

