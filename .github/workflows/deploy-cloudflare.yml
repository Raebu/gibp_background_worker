      # Zero-credit proof: uses only existing compliance/QEV-eligible contacts and never calls Apollo enrichment.
      - name: Prove personalised outreach simulation across distinct accounts without live sending
        shell: bash
        run: |
          set -euo pipefail

          if [ "$(node -p 'JSON.parse(require("fs").readFileSync("wrangler.jsonc","utf8")).vars.SEND_MODE')" != "dry_run" ]; then
