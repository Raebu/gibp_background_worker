                   AND action='qev_verification_exception') AS qev_exceptions_after,
              (SELECT COUNT(*) FROM audit_events
                 WHERE category='contacts'
                   AND action='qev_verification_exception') - $BEFORE_EXCEPTIONS AS qev_exception_delta,
              $BEFORE_OUTBOUND AS real_outbound_before,
              (SELECT COUNT(*) FROM messages WHERE direction='outbound') AS real_outbound_after;
