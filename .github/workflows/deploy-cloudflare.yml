          if (config.vars.SEND_MODE !== "dry_run") throw new Error("Simulation commissioning requires SEND_MODE=dry_run")
          NODE

          query_scalar() {
            local sql="$1"
            npx wrangler d1 execute GROWTH_DB --remote --json --command "$sql" \
